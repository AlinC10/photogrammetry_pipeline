services:
  turntable-studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # stats.json records it: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose build
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        # Parallel compile jobs (~2 GB RAM each): BUILD_JOBS=2 docker compose build if 4 still runs out of memory
        BUILD_JOBS: ${BUILD_JOBS:-4}
    image: turntable-studio:latest
    container_name: turntable_studio_worker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount input images and output deliverables
      - ./input_images:/workspace/input_images:ro
      - ./output:/workspace/output:rw
      # Undistorted images + OpenMVS depth maps (~9 GB): a Docker volume is much faster than a
      # Windows folder bind-mounted through WSL. Logs, reports and deliverables still land in ./output.
      - turntable_work:/tmp/turntable_work
    command: ["--input_dir", "/workspace/input_images", "--output_dir", "/workspace/output", "--rig_mode", "--texturing_engine", "texrecon", "--focal_length_mm", "3.9"]

volumes:
  turntable_work:
